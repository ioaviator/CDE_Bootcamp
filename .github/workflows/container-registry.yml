name: Data Pipeline
on:
  push:
    branches:
      - project
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: 'Login to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Build and push image'
        run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/cde_project:latest
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/cde_project:latest
